[project]
name = "nonebot-plugin-blocker"
version = "0.4.9"
description = "Message Blocker"
authors = [{ name = "MerCuJerry", email = "mercujerry@gmail.com" }]
keywords = ["nonebot", "nonebot2", "qqbot", "bot"]
dependencies = [
    "nonebot2[fastapi] >= 2.5.0",
    "nonebot-adapter-onebot >= 2.4.6",
    "pydantic >=2.0,<3.0.0,!=2.5.0,!=2.5.1",
]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = {file = "LICENSE"}

[project.urls]
homepage = "https://github.com/MerCuJerry/nonebot-plugin-blocker"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["nonebot_plugin_blocker"]