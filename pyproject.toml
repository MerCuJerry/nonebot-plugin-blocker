[project]
name = "nonebot-plugin-blocker"
version = "0.5.0"
description = "Message Blocker"
authors = [{ name = "MerCuJerry", email = "mercujerry@gmail.com" }]
keywords = ["nonebot", "nonebot2", "qqbot", "bot"]
dependencies = [
    "nonebot2 >= 2.5.0",
    "pydantic >=2.0, <3.0.0",
    "nonebot_plugin_localstore>=0.7.4",
    "fastapi >= 0.141.1"
]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = {file = "LICENSE"}

[project.optional-dependencies]
onebot = [
    "nonebot-adapter-onebot >= 2.4.6"
]

milky = [
    "nonebot-adapter-milky >= 1.2.0"
]

[project.urls]
homepage = "https://github.com/MerCuJerry/nonebot-plugin-blocker"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["nonebot_plugin_blocker"]